<!DOCTYPE html>
<html lang="ar" dir="rtl">

    <head>
        <title>تواصل معنا</title>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style1.css">
    </head>

    <body>

        <h1>اتصل بنا</h1>

        <form>
            <fieldset>
                <legend>اترك رسالتك</legend><br>

                <label for="name">الإسم الأول:</label><br>

                <input type="text" name="name" placeholder="أكتب إسمك الأول..." required><br>

                <label for="Last name">الإسم الأخير:</label><br>

                <input type="text" name="Last name" placeholder="أكتب إسمك الأخير..." required><br>

                <label for="email">البريد الإلكتروني:</label><br>

                <input type="email" name="email" placeholder="example@gmail.com" required><br>

                <label for="message">الرسالة:</label><br>

                <textarea placeholder="أكتب رسالتك هنا..." required></textarea><br>

                <input type="submit" value="إرسال">

            </fieldset>
        </form>

    </body>

</html>
